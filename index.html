<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 100px;
        }
        .box{
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 50vw;
            margin-top: 40px;
        }
        .btn{
            padding: 10px 20px;
            border-radius: 10px;
            border-style: none;
            background-color: grey;
            color: white;
        }
        .btn:hover{
            background-color: darkgray;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <a href="/"><button class="home btn">Home</button></a>
        <a href="/about"><button class="about btn">About</button></a>
        <a href="/contact"><button class="contact btn">Contact Me</button></a>
    </div>
    <h1>INDEX</h1>
</body>
</html>
